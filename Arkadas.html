<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f7a5a">
<title>Arkadaş</title>
<style>
:root{
  --bg:#f2f5f1; --surface:#ffffff; --fg:#18211c; --muted:#6a766f; --line:#dce3de;
  --accent:#1f7a5a; --accent-fg:#ffffff; --head:#1f7a5a; --head-fg:#ffffff;
  --mine:#d3f0e0; --mine-fg:#10261b; --theirs:#ffffff; --chatbg:#e8eee8;
  --danger:#c0392b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1512; --surface:#18211c; --fg:#e8efea; --muted:#92a199; --line:#2a3731;
    --accent:#34b583; --accent-fg:#07130d; --head:#17382d; --head-fg:#ffffff;
    --mine:#1f5f48; --mine-fg:#ffffff; --theirs:#1f2b25; --chatbg:#0c110f;
    --danger:#e57368;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; -webkit-text-size-adjust:100%; overscroll-behavior:none;
}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
.view{display:none; flex:1; min-height:0; flex-direction:column}
.view.on{display:flex}
.top{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--head); color:var(--head-fg);
}
.top h1{margin:0; font-size:1.2rem; flex:1; letter-spacing:.01em}
.ghost{background:none; border:0; color:var(--head-fg); font-size:1.3rem; padding:6px 8px; border-radius:10px}
.avatar{
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:44px; height:44px; border-radius:50%; color:#fff; font-weight:700; font-size:1.1rem;
  border:0; padding:0;
}
.avatar.sm{width:38px; height:38px; font-size:1rem}
.avatar.lg{width:84px; height:84px; font-size:2rem}
.tabs{display:flex; background:var(--surface); border-bottom:1px solid var(--line)}
.tabs button{
  flex:1; background:none; border:0; padding:12px; color:var(--muted); font-weight:600;
  border-bottom:3px solid transparent;
}
.tabs button.on{color:var(--accent); border-bottom-color:var(--accent)}
.list{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column}
.row{
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.row-mid{flex:1; min-width:0}
.row-name{font-weight:600}
.row-sub{font-size:.85rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-sub.bold{color:var(--fg); font-weight:600}
.row-end{display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-size:.75rem; color:var(--muted)}
.dot{width:10px; height:10px; border-radius:50%; background:var(--accent)}
.pill{border:0; background:var(--accent); color:var(--accent-fg); padding:8px 16px; border-radius:999px; font-weight:600}
.empty{margin:auto; padding:32px 24px; color:var(--muted); text-align:center; max-width:32ch}
.peer{
  flex:1; min-width:0; display:flex; align-items:center; gap:10px; background:none; border:0;
  color:var(--head-fg); text-align:left; padding:0;
}
.peer-txt{display:flex; flex-direction:column; min-width:0}
.peer-txt b{font-size:1.02rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.peer-txt small{font-size:.75rem; opacity:.85}
.msgs{
  flex:1; min-height:0; overflow-y:auto; padding:12px;
  display:flex; flex-direction:column; gap:6px; background:var(--chatbg);
}
.msg{max-width:82%; display:flex; flex-direction:column; gap:2px}
.msg.mine{align-self:flex-end; align-items:flex-end}
.msg.theirs{align-self:flex-start; align-items:flex-start}
.bubble{
  padding:8px 12px; border-radius:16px; overflow-wrap:anywhere; white-space:pre-wrap;
  background:var(--theirs); border:1px solid var(--line);
}
.mine .bubble{background:var(--mine); color:var(--mine-fg); border-color:transparent; border-bottom-right-radius:4px}
.theirs .bubble{border-bottom-left-radius:4px}
.bubble.gone{font-style:italic; color:var(--muted); background:transparent}
.bubble.photo{padding:4px}
.bubble img{display:block; max-width:100%; width:240px; height:auto; border-radius:12px}
.time{font-size:.7rem; color:var(--muted); padding:0 4px}
.del{
  display:none; background:var(--surface); border:1px solid var(--line); color:var(--danger);
  border-radius:999px; padding:4px 10px; font-size:.8rem;
}
.msg.sel .del{display:inline-block}
.typing{display:none; align-items:center; gap:6px; padding:4px 16px 6px; font-size:.8rem; color:var(--muted); background:var(--chatbg)}
.typing.on{display:flex}
.dots{display:inline-flex; gap:3px}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:tdot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{opacity:.3; transform:translateY(0)}30%{opacity:1; transform:translateY(-3px)}}
#composer,#jcomposer{
  display:flex; align-items:flex-end; gap:8px; padding:8px 10px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--surface); border-top:1px solid var(--line);
}
#text,#jtext{
  flex:1; min-width:0; resize:none; max-height:120px; font:inherit; color:var(--fg);
  background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:10px 14px;
}
.icon-btn,.send{flex:none; height:42px; border-radius:21px; border:0}
.icon-btn{width:42px; background:var(--bg); border:1px solid var(--line); font-size:1.15rem}
.icon-btn.rec{background:#c0392b; color:#fff; border-color:#c0392b}
.send{padding:0 18px; background:var(--accent); color:var(--accent-fg); font-weight:600}
.overlay{position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center}
.overlay.dark{background:rgba(0,0,0,.92); align-items:center; z-index:15}
.overlay.dark img{max-width:100%; max-height:100%}
.sheet{
  width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
  padding:20px 18px; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  max-height:88%; overflow-y:auto;
}
.sheet-in{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.sheet h2{margin:0}
.sub{color:var(--muted); font-size:.85rem}
.btn{
  display:block; width:100%; border:0; border-radius:12px; padding:12px; background:var(--accent);
  color:var(--accent-fg); font-weight:600; text-align:center; text-decoration:none;
}
.btn.alt{background:var(--bg); color:var(--fg); border:1px solid var(--line)}
.btn.bad{background:none; color:var(--danger); border:1px solid var(--line)}
.sheet input{
  width:100%; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line);
  border-radius:12px; padding:12px 14px; text-align:center;
}
.code{
  width:100%; word-break:break-all; background:var(--bg); border:1px solid var(--line);
  border-radius:10px; padding:8px; font-family:ui-monospace,monospace; font-size:.85rem;
}
.help{font-size:.8rem; color:var(--muted); text-align:left; width:100%}
#toast{
  position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  z-index:40; background:#222; color:#fff; padding:10px 16px; border-radius:12px; font-size:.9rem;
  max-width:90%; text-align:center;
}
#name-screen{
  position:fixed; inset:0; z-index:30; background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#name-box{width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px}
#name-box h2{margin:0; font-size:1.5rem}
#name-box p{margin:0; color:var(--muted)}
#name-box input{
  font:inherit; color:var(--fg); background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:12px 14px;
}
#name-box button{font-weight:600; border:0; border-radius:12px; padding:12px; background:var(--accent); color:var(--accent-fg)}
.callui{
  position:fixed; inset:0; z-index:20; background:#0b1210; color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:48px 24px calc(36px + env(safe-area-inset-bottom,0px));
}
.callui video{position:absolute; display:none; background:#000}
#rv{inset:0; width:100%; height:100%; object-fit:cover}
#lv{
  right:12px; top:calc(12px + env(safe-area-inset-top,0px)); width:96px; height:136px;
  object-fit:cover; border-radius:12px; transform:scaleX(-1); z-index:2;
}
.callui.video video{display:block}
.call-info{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:40px}
.callui.video.connected #c-av, .callui.video.connected #c-name{display:none}
#c-name{font-size:1.6rem; font-weight:700}
#c-state{opacity:.9; text-shadow:0 1px 4px #000}
.call-actions{position:relative; z-index:1; display:flex; gap:22px}
.cbtn{display:flex; flex-direction:column; align-items:center; gap:6px; border:0; background:none; color:#fff; font-size:.8rem}
.ci{
  width:64px; height:64px; border-radius:50%; background:#33403a;
  display:flex; align-items:center; justify-content:center; font-size:1.6rem;
}
.cbtn.danger .ci{background:#c0392b}
.cbtn.ok .ci{background:#1f9d6b}
.cbtn.off .ci{opacity:.45}
</style>
</head>
<body>

<div id="home" class="view on">
  <header class="top">
    <h1>Arkadaş</h1>
    <button id="me-btn" class="avatar sm" type="button" aria-label="Profilim"></button>
  </header>
  <nav class="tabs">
    <button id="tab-chats" type="button" class="on">Sohbetler</button>
    <button id="tab-add" type="button">Ekle</button>
  </nav>
  <div id="home-list" class="list"></div>
</div>

<div id="chat" class="view">
  <header class="top">
    <button id="back" class="ghost" type="button" aria-label="Geri">←</button>
    <button id="peer" class="peer" type="button">
      <span id="peer-av" class="avatar sm"></span>
      <span class="peer-txt"><b id="peer-name"></b><small id="peer-status"></small></span>
    </button>
    <button id="vcall" class="ghost" type="button" aria-label="Görüntülü ara">📹</button>
    <button id="acall" class="ghost" type="button" aria-label="Sesli ara">📞</button>
  </header>
  <div id="msgs" class="msgs"></div>
  <div id="typing" class="typing"><span>yazıyor</span><span class="dots"><i></i><i></i><i></i></span></div>
  <form id="composer" autocomplete="off">
    <input type="file" id="file-gal" accept="image/*" hidden>
    <input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
    <button class="icon-btn" id="b-cam" type="button" aria-label="Fotoğraf çek">📷</button>
    <button class="icon-btn" id="b-gal" type="button" aria-label="Galeriden gönder">🖼️</button>
    <textarea id="text" rows="1" placeholder="Mesaj yaz" aria-label="Mesaj"></textarea>
    <button class="send" type="submit">Gönder</button>
  </form>
</div>

<div id="jarvis" class="view">
  <header class="top">
    <button id="j-back" class="ghost" type="button" aria-label="Geri">←</button>
    <div class="peer" style="cursor:default">
      <span id="j-av" class="avatar sm">🤖</span>
      <span class="peer-txt"><b>Jarvis</b><small id="j-status">hazır</small></span>
    </div>
    <button id="j-voice" class="ghost" type="button" aria-label="Sesli cevap">🔇</button>
    <button id="j-set" class="ghost" type="button" aria-label="Ayarlar">⚙️</button>
  </header>
  <div id="jmsgs" class="msgs"></div>
  <div id="jtyping" class="typing"><span>Jarvis düşünüyor</span><span class="dots"><i></i><i></i><i></i></span></div>
  <form id="jcomposer" autocomplete="off">
    <input type="file" id="jfile" accept="image/*" hidden>
    <button class="icon-btn" id="j-att" type="button" aria-label="Fotoğraf ekle">📎</button>
    <button class="icon-btn" id="j-mic" type="button" aria-label="Konuş">🎤</button>
    <textarea id="jtext" rows="1" placeholder="Jarvis'e yaz…" aria-label="Mesaj"></textarea>
    <button class="send" type="submit">Gönder</button>
  </form>
</div>

<div id="sheet" class="overlay" hidden><div class="sheet"><div id="sheet-body" class="sheet-in"></div></div></div>
<div id="viewer" class="overlay dark" hidden><img id="viewer-img" alt="Fotoğraf"></div>
<div id="toast" hidden></div>

<div id="name-screen" hidden>
  <form id="name-box">
    <h2>Adın ne?</h2>
    <p>Arkadaşların seni bu adla görecek.</p>
    <input id="name-input" maxlength="20" placeholder="Örn. Aras" aria-label="Adın" required>
    <button type="submit">Başla</button>
  </form>
</div>

<div id="call" class="callui" hidden>
  <video id="rv" autoplay playsinline></video>
  <video id="lv" autoplay playsinline muted></video>
  <div class="call-info">
    <div id="c-av" class="avatar lg"></div>
    <div id="c-name"></div>
    <div id="c-state"></div>
  </div>
  <div id="c-actions" class="call-actions"></div>
</div>

<script>
function arkErr(m){
  var d=document.createElement("div");
  d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b00020;color:#fff;padding:8px 10px;font:12px/1.3 monospace;word-break:break-all";
  d.textContent="Hata: "+m;
  (document.body||document.documentElement).appendChild(d);
}
window.addEventListener("error",function(e){ arkErr((e.message||"dosya yüklenemedi")+(e.lineno?" (satır "+e.lineno+")":"")); },true);
window.addEventListener("unhandledrejection",function(e){ arkErr(String(e.reason&&e.reason.message||e.reason)); });
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, onSnapshot, query,
  orderBy, limit, where, serverTimestamp, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAj8McuEIan1LTx9NzXb5NZ73Dq_NSepHY",
  authDomain: "arkadas-app-f3e00.firebaseapp.com",
  projectId: "arkadas-app-f3e00",
  storageBucket: "arkadas-app-f3e00.firebasestorage.app",
  messagingSenderId: "253421208511",
  appId: "1:253421208511:web:26a6789da8c999d829970a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ---------- yardımcılar ---------- */
const $ = (id) => document.getElementById(id);

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for(const [k, v] of Object.entries(props || {})){
    if(v == null || v === false) continue;
    if(k === "class") el.className = v;
    else if(k === "text") el.textContent = v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for(const kid of kids.flat()){ if(kid != null) el.append(kid); }
  return el;
}

function store(key, value){
  try{ if(value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); }
  catch(e){ return null; }
}

let toastT = null;
function toast(msg, ms){
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, ms || 4000);
}

function colorOf(id){
  let x = 0;
  for(const ch of String(id)) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  return "hsl(" + (x % 360) + " 50% 40%)";
}
function applyAvatar(el, id, name){
  el.style.background = colorOf(id);
  el.textContent = (name || "?").trim().charAt(0).toUpperCase() || "?";
}
function avatar(id, name, cls){
  const el = h("span", { class: "avatar " + (cls || "") });
  applyAvatar(el, id, name);
  return el;
}

function fmtTime(x){
  if(!x) return "";
  const d = x instanceof Date ? x : new Date(x);
  return d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
}
function presence(u){
  if(!u || !u.lastSeen) return "";
  if(Date.now() - u.lastSeen < 100000) return "çevrimiçi";
  const d = new Date(u.lastSeen);
  const same = d.toDateString() === new Date().toDateString();
  const day = same ? "" : d.toLocaleDateString("tr-TR", { day: "numeric", month: "short" }) + " ";
  return "son görülme " + day + fmtTime(d);
}
function autosize(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

/* ---------- kimlik ---------- */
let myName = store("ark_name") || "";
let myId = store("ark_id");
if(!myId){
  myId = Math.random().toString(36).slice(2) + Date.now().toString(36);
  store("ark_id", myId);
}
const chatIdOf = (a, b) => [a, b].sort().join("_");
const topicOf = (id) => "arkadas-" + String(id).slice(0, 12);
const userRef = (id) => doc(db, "users", id);

/* ---------- durum ---------- */
let users = {}, chats = {}, tab = "chats";
let peerId = null, unsubMsgs = null, msgDocs = [], firstRender = true, marked = {};
let lastPing = 0, idleT = null;
let jOpen = false, jFirst = true, jBusy = false, jSpeakNext = false, jModelG = null, jModelF = null;
let jHist = [];
try{ jHist = JSON.parse(store("ark_jhist") || "[]"); if(!Array.isArray(jHist)) jHist = []; }catch(e){ jHist = []; }

async function saveMe(quiet){
  if(!myName) return;
  try{
    await setDoc(userRef(myId), { name: myName, lastSeen: Date.now() }, { merge: true });
  }catch(e){
    console.error(e);
    if(!quiet) toast("Bağlantı sorunu. İnterneti ve Firestore izinlerini kontrol et.");
  }
}

function showNameScreen(){
  $("name-input").value = myName;
  $("name-screen").hidden = false;
  $("name-input").focus();
}
$("name-box").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("name-input").value.trim();
  if(!v) return;
  myName = v;
  store("ark_name", v);
  $("name-screen").hidden = true;
  applyAvatar($("me-btn"), myId, myName);
  saveMe();
});

/* ---------- dinleyiciler ---------- */
onSnapshot(collection(db, "users"), (snap) => {
  users = {};
  snap.forEach((s) => { users[s.id] = s.data(); });
  renderHome();
  refreshPeer();
}, (err) => { console.error(err); toast("Kişiler yüklenemedi. Firestore izinlerini kontrol et."); });

onSnapshot(query(collection(db, "chats"), where("members", "array-contains", myId)), (snap) => {
  chats = {};
  snap.forEach((s) => { chats[s.id] = s.data(); });
  renderHome();
  updateTyping();
  markRead();
}, (err) => { console.error(err); });

/* ---------- ana ekran ---------- */
const friendsList = () => (users[myId] && users[myId].friends) || [];

$("tab-chats").addEventListener("click", () => { tab = "chats"; renderHome(); });
$("tab-add").addEventListener("click", () => { tab = "add"; renderHome(); });
$("me-btn").addEventListener("click", () => openProfile(myId));

function jarvisRow(){
  const last = jHist[jHist.length - 1];
  const av = h("span", { class: "avatar", text: "🤖" });
  av.style.background = "linear-gradient(135deg,#1f7a5a,#2b6cb0)";
  const sub = last ? (last.role === "user" ? "Sen: " : "") + String(last.text || "").slice(0, 60) : "Sor, konuş, ne istersen yap";
  return h("div", { class: "row", role: "button", onclick: openJarvis },
    av,
    h("div", { class: "row-mid" },
      h("div", { class: "row-name", text: "Jarvis ✨" }),
      h("div", { class: "row-sub", text: sub })),
    h("div", { class: "row-end" }, h("div", { text: last ? fmtTime(last.t) : "" })));
}

function renderHome(){
  $("tab-chats").classList.toggle("on", tab === "chats");
  $("tab-add").classList.toggle("on", tab === "add");
  const box = $("home-list");
  box.textContent = "";
  const fr = friendsList().filter((id) => users[id]);

  if(tab === "chats"){
    box.append(jarvisRow());
    if(!fr.length){
      box.append(h("div", { class: "empty", text: "Henüz arkadaşın yok. “Ekle” sekmesinden arkadaşlarını ekle." }));
      return;
    }
    const rows = fr.map((id) => ({ id, u: users[id], c: chats[chatIdOf(myId, id)] || {} }));
    rows.sort((a, b) =>
      (b.c.lastTs || 0) - (a.c.lastTs || 0) ||
      (a.u.name || "").localeCompare(b.u.name || "", "tr"));
    for(const r of rows){
      const unread = r.c.lastTs && r.c.lastFrom !== myId &&
        r.c.lastTs > ((r.c.read && r.c.read[myId]) || 0);
      const av = avatar(r.id, r.u.name);
      av.addEventListener("click", (e) => { e.stopPropagation(); openProfile(r.id); });
      const preview = r.c.lastText
        ? (r.c.lastFrom === myId ? "Sen: " : "") + r.c.lastText

async function shrink(file){
  let src = null, W = 0, H = 0, bmp = null;
  try{ bmp = await createImageBitmap(file); }catch(e){ bmp = null; }
  if(bmp){ src = bmp; W = bmp.width; H = bmp.height; }
  else{
    src = await new Promise((resolve, reject) => {
      const img = new Image();
      const u = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(u); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(u); reject(new Error("img")); };
      img.src = u;
    });
    W = src.naturalWidth || src.width; H = src.naturalHeight || src.height;
  }
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  let max = 800, q = 0.65, url = "";
  for(let i = 0; i < 5; i++){
    const s = Math.min(1, max / Math.max(W, H));
    c.width = Math.max(1, Math.round(W * s));
    c.height = Math.max(1, Math.round(H * s));
    ctx.drawImage(src, 0, 0, c.width, c.height);
    url = c.toDataURL("image/jpeg", q);
    if(url.length < 450000) break;
    max = Math.round(max * 0.8);
    q = Math.max(0.5, q - 0.05);
  }
  if(bmp && bmp.close) bmp.close();
  c.width = 1; c.height = 1;
  if(url.length > 900000) throw new Error("big");
  return url;
}

function cleanText(t){
  return String(t)
    .replace(/\*\*(.+?)\*\*/g, "$1")
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/^\s*[*-]\s+/gm, "• ")
    .replace(/`{1,3}/g, "");
}

function stripAds(t){
  const parts = String(t).split(/\n{2,}/);
  while(parts.length > 1 && (/pollinations/i.test(parts[parts.length - 1]) || /^[-*_]{3,}$/.test(parts[parts.length - 1].trim()))){
    parts.pop();
  }
  return parts.join("\n\n").trim();
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const plain = cleanText(text).replace(/[•*_#]/g, "").replace(/\s+/g, " ").trim();
    if(!plain) return;
    const parts = plain.match(/[^.!?…]+[.!?…]*/g) || [plain];
    const chunks = [];
    let buf = "";
    for(const p of parts){
      if((buf + p).length > 180 && buf){ chunks.push(buf); buf = p; } else buf += p;
    }
    if(buf) chunks.push(buf);
    for(const c of chunks){
      const u = new SpeechSynthesisUtterance(c.trim());
      u.lang = "tr-TR"; u.rate = 1.02;
      speechSynthesis.speak(u);
    }
  }catch(e){}
}

/* Gemini (anahtar girilmişse) */
function buildContents(){
  const arr = [];
  const slice = jHist.slice(-24);
  const lastMsg = jHist[jHist.length - 1];
  for(const m of slice){
    const role = m.role === "user" ? "user" : "model";
    const parts = [{ text: (m.prompt || m.text) || "." }];
    if(m.img && m === lastMsg){
      parts.push({ inlineData: { mimeType: "image/jpeg", data: m.img.split(",")[1] } });
    }
    const prev = arr[arr.length - 1];
    if(prev && prev.role === role) prev.parts.push(...parts);
    else arr.push({ role, parts });
  }
  while(arr.length && arr[0].role !== "user") arr.shift();
  return arr;
}

async function askGemini(){
  const key = store("ark_jkey");
  const list = [];
  const custom = store("ark_jmodel");
  if(custom) list.push(custom);
  if(jModelG) list.push(jModelG);
  ["gemini-2.5-flash", "gemini-3.5-flash", "gemini-2.5-flash-lite"].forEach((m) => list.push(m));
  const models = [...new Set(list)];
  const body = { systemInstruction: { parts: [{ text: jSystem() }] }, contents: buildContents() };
  let lastStatus = 0, lastMsg = "";
  for(const m of models){
    let res;
    try{
      res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(m) +
        ":generateContent?key=" + encodeURIComponent(key),
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      );
    }catch(e){ throw new Error("NET"); }
    if(res.ok){
      const data = await res.json();
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      const txt = parts.filter((p) => p.text && !p.thought).map((p) => p.text).join("").trim();
      if(txt){ jModelG = m; return txt; }
      const br = data.promptFeedback && data.promptFeedback.blockReason;
      throw new Error(br ? "BLOCK" : "EMPTY");
    }
    lastStatus = res.status;
    lastMsg = "";
    try{ const j = await res.json(); lastMsg = (j.error && j.error.message) || ""; }catch(e){}
    if(res.status === 400 || res.status === 401 || res.status === 403) break;
  }
  const err = new Error("HTTP");
  err.status = lastStatus; err.detail = lastMsg;
  throw err;
}

/* Ücretsiz, anahtarsız servis (Pollinations) */
function buildMessages(){
  const arr = [{ role: "system", content: jSystem() }];
  const lastMsg = jHist[jHist.length - 1];
  for(const m of jHist.slice(-20)){
    const role = m.role === "user" ? "user" : "assistant";
    const txt = (m.prompt || m.text) || ".";
    let content = txt;
    if(m.img && m === lastMsg){
      content = [{ type: "text", text: txt }, { type: "image_url", image_url: { url: m.img } }];
    }
    const prev = arr[arr.length - 1];
    if(prev && prev.role === role && typeof prev.content === "string" && typeof content === "string"){
      prev.content += "\n" + content;
    } else {
      arr.push({ role, content });
    }
  }
  while(arr.length > 1 && arr[1].role !== "user") arr.splice(1, 1);
  return arr;
}

async function askFree(){
  const list = [];
  const custom = store("ark_jmodel");
  if(custom) list.push(custom);
  if(jModelF) list.push(jModelF);
  ["openai", "openai-fast", "mistral"].forEach((m) => list.push(m));
  const models = [...new Set(list)];
  let lastStatus = 0, lastMsg = "";
  for(const m of models){
    let res;
    try{
      res = await fetch("https://text.pollinations.ai/openai?referrer=arasbezir.github.io", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: m, messages: buildMessages() })
      });
    }catch(e){ throw new Error("NET"); }
    const raw = await res.text();
    if(res.ok){
      let txt = "";
      try{
        const j = JSON.parse(raw);
        txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
      }catch(e){ txt = raw; }
      txt = stripAds(String(txt).trim());
      if(txt){ jModelF = m; return txt; }
      throw new Error("EMPTY");
    }
    lastStatus = res.status;
    lastMsg = raw.slice(0, 200);
    if(res.status === 401 || res.status === 402 || res.status === 403) break;
  }
  const err = new Error("HTTP");
  err.status = lastStatus; err.detail = lastMsg; err.free = true;
  throw err;
}

async function askAI(){
  if(store("ark_jkey")){

      if(e.status === 429 || e.message === "NET"){

}

function jErrText(e){
  if(e.message === "NET") return "İnternet bağlantısı yok ya da servise ulaşılamadı.";
  if(e.message === "BLOCK") return "Bu isteğe cevap veremedim (güvenlik filtresi).";
  if(e.message === "EMPTY") return "Boş cevap geldi, tekrar dene.";
  const s = e.status;
  if(e.free){
    if(s === 401 || s === 402 || s === 403) return "Ücretsiz servis artık anahtar istiyor. ⚙️'dan Gemini anahtarı girersen çalışır.";
    if(s === 429) return "Ücretsiz servis yoğun, biraz bekleyip tekrar dene.";
    return "Ücretsiz servis cevap vermedi (" + (s || "?") + "). Biraz sonra dene ya da ⚙️'dan Gemini anahtarı gir.";
  }
  if(s === 400 && /api key/i.test(e.detail || "")) return "Anahtar geçersiz. ⚙️'dan doğru anahtarı gir ya da sil.";
  if(s === 400) return "İstek reddedildi: " + String(e.detail || "").slice(0, 120);
  if(s === 401 || s === 403) return "Anahtar çalışmıyor ya da izin yok. ⚙️'dan yeni anahtar dene ya da sil.";
  if(s === 404) return "Model bulunamadı. ⚙️'dan model adını değiştirmeyi dene.";
  if(s === 429) return "Ücretsiz limit doldu. Biraz bekleyip tekrar dene.";
  return "Jarvis şu an cevap veremiyor (" + (s || "?") + "). Sonra tekrar dene.";
}

      if(m.text && m.text !== "📷 Fotoğraf"){
        bubble.append(h("div", { style: "padding:6px 8px 2px", text: m.text }));
      }
    } else {
      bubble.textContent = mine ? m.text : cleanText(m.text);
    }
    if(!mine) bubble.addEventListener("click", () => speak(m.text));
    box.append(h("div", { class: "msg " + (mine ? "mine" : "theirs") }, bubble,
      h("div", { class: "time", text: fmtTime(m.t) })));
  }
  if(near || jFirst){ box.scrollTop = box.scrollHeight; jFirst = false; }
}

async function jSend(text, img){
  text = (text || "").trim();
  if(!text && !img) return;
  if(jBusy){ toast("Jarvis düşünüyor…"); return; }
  jBusy = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  const userMsg = {
    role: "user", text: text || "📷 Fotoğraf",
    prompt: img ? (text || "Bu fotoğrafı kısaca anlat.") : undefined,
    img: img || null, t: Date.now()
  };
  jHist.push(userMsg);
  renderJ(); saveJ(); jFirst = true;
  jThinking(true);
  try{
    const reply = await askAI();
    jHist.push({ role: "model", text: reply, t: Date.now() });
    saveJ(); renderJ(); jFirst = true;
    if(jSpeakNext || store("ark_jvoice") === "1") speak(reply);
  }catch(e){
    console.error(e);
    toast(jErrText(e), 7000);
  }
  jSpeakNext = false; jBusy = false;
  jThinking(false);
}

let recog = null, listening = false;
$("j-mic").addEventListener("click", () => {
  if(listening){ try{ recog.stop(); }catch(e){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Bu tarayıcı sesli yazmayı desteklemiyor. Klavyedeki mikrofonu kullan."); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  recog = new SR();
  recog.lang = "tr-TR";
  recog.interimResults = true;
  recog.continuous = false;
  let finalText = "";
  recog.onstart = () => {
    listening = true;
    $("j-mic").classList.add("rec");
    jtextEl.placeholder = "Dinliyorum…";
  };
  recog.onresult = (e) => {
    let t = "";
    for(let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    finalText = t;
    jtextEl.value = t;
    autosize(jtextEl);
  };
  recog.onerror = (e) => {
    if(e.error === "not-allowed" || e.error === "service-not-allowed") toast("Mikrofon izni ver.");
    else if(e.error !== "no-speech" && e.error !== "aborted") toast("Ses algılanamadı: " + e.error);
  };
  recog.onend = () => {
    listening = false;
    $("j-mic").classList.remove("rec");
    jtextEl.placeholder = "Jarvis'e yaz…";
    const t = finalText.trim();
    if(t){
      jtextEl.value = "";
      autosize(jtextEl);
      jSpeakNext = true;
      jSend(t, null);
    }
  };
  try{ recog.start(); }catch(e){ listening = false; }
});

/* ---------- arama (WebRTC + Firestore) ---------- */
const RTC_CONFIG = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" }
]};
let pc = null, localStream = null, callRef = null, callRole = null, callVideo = false;
let callUnsubs = [], pendingCand = [], callTimerI = null, callStart = 0, callTimeout = null;
let answerSet = false, wakeLock = null;
let ringCtx = null, ringI = null;

function startRing(){
  stopRing();
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    ringCtx = new AC();
    if(ringCtx.state === "suspended") ringCtx.resume();
    const pattern = () => {
      if(!ringCtx) return;
      const t0 = ringCtx.currentTime;
      [0, 0.45].forEach((off, i) => {
        const o = ringCtx.createOscillator(), g = ringCtx.createGain();
        o.type = "square"; o.frequency.value = i ? 660 : 880;
        g.gain.setValueAtTime(0.9, t0 + off);
        g.gain.setValueAtTime(0, t0 + off + 0.35);
        o.connect(g); g.connect(ringCtx.destination);
        o.start(t0 + off); o.stop(t0 + off + 0.4);
      });
      if(navigator.vibrate) navigator.vibrate([400, 150, 400]);
    };
    pattern();
    ringI = setInterval(pattern, 2200);
  }catch(e){}
}
function stopRing(){
  clearInterval(ringI); ringI = null;
  try{ if(ringCtx) ringCtx.close(); }catch(e){}
  ringCtx = null;
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
}

function setCallUI(state, buttons){
  $("c-state").textContent = state;
  const a = $("c-actions");
  a.textContent = "";
  for(const b of buttons){
    a.append(h("button", { type: "button", class: "cbtn " + (b.cls || ""), onclick: b.fn, "aria-label": b.label },
      h("span", { class: "ci", text: b.icon }),
      h("span", { text: b.label })));
  }
}
function openCallUI(id, video, fallbackName){
  const u = users[id] || {};
  const nm = u.name || fallbackName || "Biri";
  $("c-name").textContent = nm;
  applyAvatar($("c-av"), id, nm);
  $("call").classList.toggle("video", !!video);
  $("call").classList.remove("connected");
  $("call").hidden = false;
}

function cleanupCall(){
  callUnsubs.forEach((u) => { try{ u(); }catch(e){} });
  callUnsubs = []; pendingCand = [];
  clearInterval(callTimerI); clearTimeout(callTimeout);
  callTimerI = null; callStart = 0; answerSet = false;
  stopRing();
  if(pc){ try{ pc.close(); }catch(e){} pc = null; }
  if(localStream){ localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  $("rv").srcObject = null; $("lv").srcObject = null;
  callRef = null; callRole = null;
  $("call").hidden = true;
  $("call").classList.remove("video", "connected");
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock = null;
}
async function hangup(){
  const r = callRef;
  cleanupCall();
  if(r){ try{ await updateDoc(r, { status: "ended" }); }catch(e){} }
}

function toggleMute(e){
  const t = localStream && localStream.getAudioTracks()[0];
  if(!t) return;
  t.enabled = !t.enabled;
  e.currentTarget.classList.toggle("off", !t.enabled);
}
function toggleCam(e){
  const t = localStream && localStream.getVideoTracks()[0];
  if(!t) return;
  t.enabled = !t.enabled;
  e.currentTarget.classList.toggle("off", !t.enabled);
}
function callButtons(){
  const arr = [{ icon: "🎤", label: "Sessiz", fn: toggleMute }];
  if(callVideo) arr.push({ icon: "📷", label: "Kamera", fn: toggleCam });
  arr.push({ icon: "📵", label: "Kapat", cls: "danger", fn: hangup });
  return arr;
}
function onConnected(){
  if(callStart) return;
  callStart = Date.now();
  $("call").classList.add("connected");
  setCallUI("00:00", callButtons());
  callTimerI = setInterval(() => {
    const s = Math.floor((Date.now() - callStart) / 1000);
    $("c-state").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 1000);
}

async function setupPc(video){
  localStream = await navigator.mediaDevices.getUserMedia({
    audio: true, video: video ? { facingMode: "user" } : false
  });
  pc = new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  $("lv").srcObject = localStream;
  pc.ontrack = (e) => { $("rv").srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if(!pc) return;
    if(pc.connectionState === "connected") onConnected();
    if(pc.connectionState === "failed"){
      toast("Bağlanılamadı. İkiniz de aynı wifi'da deneyin.");
      hangup();
    }
  };
  try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}

async function flushCand(){
  if(!pc || !pc.remoteDescription) return;
  while(pendingCand.length){
    const c = pendingCand.shift();
    try{ await pc.addIceCandidate(c); }catch(e){ console.error(e); }
  }
}
function listenCand(coll){
  callUnsubs.push(onSnapshot(collection(db, "calls", callRef.id, coll), (snap) => {
    snap.docChanges().forEach((ch) => { if(ch.type === "added") pendingCand.push(ch.doc.data()); });
    flushCand();
  }));
}

function notifyCallee(id){
  try{
    const qs = new URLSearchParams({
      title: "Arkadas", priority: "urgent", tags: "telephone_receiver",
      click: location.href.split("#")[0].split("?")[0]
    });
    fetch("https://ntfy.sh/" + topicOf(id) + "?" + qs.toString(), {
      method: "POST",
      body: myName + (callVideo ? " görüntülü arıyor 📹" : " arıyor 📞")
    }).catch(() => {});
  }catch(e){}
}

async function startCall(friendId, video){
  if(pc || callRole) return;
  closeSheet();
  callVideo = !!video; callRole = "caller";
  openCallUI(friendId, callVideo);
  setCallUI("Hazırlanıyor…", [{ icon: "📵", label: "İptal", cls: "danger", fn: hangup }]);
  try{
    await setupPc(callVideo);
    callRef = await addDoc(collection(db, "calls"), {
      callerId: myId, callerName: myName, calleeId: friendId,
      video: callVideo, status: "preparing", ts: Date.now()
    });
    const myRef = callRef;
    pc.onicecandidate = (e) => {
      if(e.candidate && callRef){
        addDoc(collection(db, "calls", callRef.id, "callerCandidates"), e.candidate.toJSON()).catch(() => {});
      }
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await updateDoc(callRef, { offer: { type: offer.type, sdp: offer.sdp }, status: "ringing", ts: Date.now() });
    setCallUI("Aranıyor…", [{ icon: "📵", label: "İptal", cls: "danger", fn: hangup }]);
    callUnsubs.push(onSnapshot(callRef, async (s) => {
      const d = s.data();
      if(!d || !pc) return;
      if(d.answer && !answerSet){
        answerSet = true;
        try{ await pc.setRemoteDescription(d.answer); }catch(e){ console.error(e); }
        flushCand();
      }
      if(d.status === "ended") cleanupCall();
    }));
    listenCand("calleeCandidates");
    notifyCallee(friendId);
    callTimeout = setTimeout(() => {
      if(callRef === myRef && callRole === "caller" && !callStart){
        toast("Açan olmadı.");
        hangup();
      }
    }, 45000);
  }catch(err){
    console.error(err);
    toast("Arama başlatılamadı. Mikrofon/kamera iznini kontrol et.");
    await hangup();
  }
}

async function answerCall(id, d){
  stopRing();
  callVideo = !!d.video;
  setCallUI("Bağlanıyor…", [{ icon: "📵", label: "Kapat", cls: "danger", fn: hangup }]);
  try{
    await setupPc(callVideo);
    pc.onicecandidate = (e) => {
      if(e.candidate && callRef){
        addDoc(collection(db, "calls", callRef.id, "calleeCandidates"), e.candidate.toJSON()).catch(() => {});
      }
    };
    listenCand("callerCandidates");
    await pc.setRemoteDescription(d.offer);
    flushCand();
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await updateDoc(callRef, { answer: { type: ans.type, sdp: ans.sdp }, status: "active" });
  }catch(err){
    console.error(err);
    toast("Cevaplanamadı. Mikrofon/kamera iznini kontrol et.");
    await hangup();
  }
}

function incoming(id, d){
  callRef = doc(db, "calls", id);
  callRole = "callee"; callVideo = !!d.video;
  openCallUI(d.callerId, callVideo, d.callerName);
  setCallUI(callVideo ? "Görüntülü arama…" : "Sesli arama…", [
    { icon: "✅", label: "Cevapla", cls: "ok", fn: () => answerCall(id, d) },
    { icon: "📵", label: "Reddet", cls: "danger", fn: hangup }
  ]);
  startRing();
  callUnsubs.push(onSnapshot(callRef, (s) => {
    const x = s.data();
    if(!x) return;
    if(x.status === "ended") cleanupCall();
    if(x.status === "active" && !pc) cleanupCall();
  }));
}

$("acall").addEventListener("click", () => { if(peerId) startCall(peerId, false); });
$("vcall").addEventListener("click", () => { if(peerId) startCall(peerId, true); });

onSnapshot(query(collection(db, "calls"), where("calleeId", "==", myId), where("status", "==", "ringing")), (snap) => {
  snap.docChanges().forEach((ch) => {
    if(ch.type !== "added") return;
    const d = ch.doc.data();
    if(Date.now() - d.ts > 60000) return;
    if(pc || callRole) return;
    incoming(ch.doc.id, d);
  });
}, (err) => { console.error(err); });

/* ---------- başlangıç ---------- */
applyAvatar($("me-btn"), myId, myName);
if(myName){ saveMe(); } else { showNameScreen(); }
setInterval(() => { if(!document.hidden && myName) saveMe(true); }, 60000);
renderHome();
